<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#181b22" />
  <title>Toloot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGIN -->
  <section id="screen-login" class="screen">
    <div class="login-box">
      <h1>Toloot</h1>
      <p>Mercado de trueque con Tetris. Armá tu vidriera y dominá el feed.</p>
      <button id="btn-google" class="btn primary">Entrar con Google</button>
      <button id="btn-anon" class="btn ghost">Entrar como invitado</button>
      <p id="login-error" class="error"></p>
    </div>
  </section>

  <!-- APP -->
  <section id="screen-app" class="hidden">
    <header class="topbar">
      <div><strong id="my-name">…</strong><span id="my-level" class="chip"></span></div>
      <button id="btn-logout" class="icon-btn" title="Salir">⎋</button>
    </header>

    <main class="views">
      <!-- MERCADO -->
      <section id="view-market" class="view active">
        <div class="search">
          <input id="search" type="search" placeholder="Buscar en el mercado…" autocomplete="off" />
        </div>
        <div id="feed" class="feed"></div>
        <div id="results" class="results hidden"></div>
      </section>

      <!-- INVENTARIO -->
      <section id="view-inventory" class="view">
        <div class="section-title">Vidriera pública <small id="grid-count"></small></div>
        <div class="grid-wrap" id="grid-wrap">
          <div id="grid"></div>
          <div id="preview" class="hidden"></div>
        </div>
        <p class="hint">Arrastrá para acomodar · tocá un ítem para rotarlo · sacalo de la vidriera para devolverlo al cajón.</p>
        <div class="drawer" id="drawer">
          <button id="drawer-toggle" class="drawer-handle">
            <span>Cajón privado <span id="stash-count"></span></span><span>▾</span>
          </button>
          <div id="stash" class="stash"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-view="market" class="active">🛒<span>Mercado</span></button>
      <button data-view="inventory">🎒<span>Mi vidriera</span></button>
    </nav>

    <button id="fab" class="fab hidden" title="Nuevo producto">+</button>
  </section>

  <!-- MODAL: nuevo producto -->
  <div id="modal-new" class="modal hidden">
    <form id="form-new" class="sheet">
      <div class="sheet-head">
        <strong>Nuevo producto</strong>
        <button type="button" class="icon-btn" data-close>✕</button>
      </div>
      <label>Título <input name="title" maxlength="80" required /></label>
      <label>Descripción <textarea name="description" maxlength="1000" rows="3"></textarea></label>
      <label>Condición <select name="condition"></select></label>
      <label>Fotos (hasta 3, opcional) <input name="photos" type="file" accept="image/*" multiple /></label>
      <span class="field-title">Tamaño: define puntos y visibilidad</span>
      <div id="tier-list" class="tiers"></div>
      <button class="btn primary" type="submit">Guardar en el cajón</button>
    </form>
  </div>

  <!-- MODAL: detalle -->
  <div id="modal-detail" class="modal hidden">
    <div class="sheet" id="detail-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
