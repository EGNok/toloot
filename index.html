<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ToLoot - El Trueque Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E9EDC9; 
            --panel-bg: #FEFAE0; 
            --primary: #D4A373;  
            --secondary: #A3B18A; 
            --danger: #E07A5F;   
            --border-color: #000000;
            --text-main: #000000; 
            --text-light: #555555;
            
            --neo-border: 3px solid var(--border-color);
            --neo-shadow: 4px 4px 0px var(--border-color);
            --neo-shadow-sm: 2px 2px 0px var(--border-color);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Outfit', sans-serif; touch-action: manipulation;
            display: flex; justify-content: center;
        }

        #app-container {
            width: 100%; max-width: 450px; height: 100%; position: relative;
            background-color: var(--bg-color); overflow: hidden;
            border-left: var(--neo-border); border-right: var(--neo-border);
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        .neo-panel {
            background-color: var(--panel-bg); border: var(--neo-border);
            border-radius: 12px; box-shadow: var(--neo-shadow);
        }

        .neo-btn {
            background-color: var(--panel-bg); color: var(--text-main);
            border: var(--neo-border); border-radius: 8px; box-shadow: var(--neo-shadow-sm);
            font-weight: 900; text-transform: uppercase; cursor: pointer; transition: transform 0.1s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .neo-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .neo-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .neo-btn-primary { background-color: var(--primary); }
        .neo-btn-success { background-color: var(--secondary); }
        .neo-btn-danger { background-color: var(--danger); color: white; }

        .neo-input {
            background-color: #FFFFFF; border: var(--neo-border);
            border-radius: 8px; padding: 10px; font-weight: 700; width: 100%;
        }
        .neo-input:focus { outline: none; background-color: var(--panel-bg); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { scrollbar-width: none; }

        .view-section { display: none; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; padding-bottom: 5rem; padding-top: 4rem; }
        .view-section.active { display: block; }
        #view-backpack.active { display: flex; flex-direction: column; padding-bottom: 0; }
        #view-feed { padding: 0; }
        
        .feed-container { height: 100%; width: 100%; scroll-snap-type: y mandatory; overflow-y: auto; scrollbar-width: none; }
        .feed-item { height: 100%; width: 100%; scroll-snap-align: start; position: relative; background-color: #000; overflow: hidden; }
        
        .feed-carousel { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .feed-photo-container { flex: 0 0 100%; height: 100%; scroll-snap-align: center; position: relative; }
        .feed-photo { width: 100%; height: 100%; object-fit: contain; background-color: #000; }
        
        .feed-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); pointer-events: none; }
        
        .feed-card {
            position: absolute; bottom: 80px; left: 16px; right: 70px;
            background: var(--panel-bg); border: var(--neo-border); border-radius: 12px;
            padding: 12px; box-shadow: var(--neo-shadow); max-height: 100px; overflow: hidden; transition: max-height 0.3s;
        }
        .feed-card.expanded { max-height: 300px; z-index: 10; }

        .carousel-indicators { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
        .car-dot { width: 10px; height: 10px; border-radius: 50%; background: white; border: 2px solid black; opacity: 0.5; }
        .car-dot.active { opacity: 1; transform: scale(1.2); background: var(--primary); }

        .inventory-view { touch-action: none; }
        .re-grid {
            display: grid; background-color: #FFF; border: var(--neo-border);
            position: relative; margin: 0 auto; overflow: hidden; box-sizing: content-box;
        }
        .re-cell { border-right: 1px solid rgba(0,0,0,0.1); border-bottom: 1px solid rgba(0,0,0,0.1); box-sizing: border-box; }
        .re-item {
            position: absolute; background-color: var(--panel-bg); border: 2px solid var(--border-color);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: grab; user-select: none; touch-action: none; overflow: hidden; box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .re-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .drag-clone { position: fixed; pointer-events: none; z-index: 1000; transform: scale(1.05); }

        .nav-btn { color: var(--text-main); transition: background-color 0.2s; }
        .nav-btn.active { background-color: var(--primary); border: 2px solid var(--border-color); }
        
        .chat-bubble-me { background-color: var(--primary); color: var(--text-main); border: 2px solid var(--border-color); border-radius: 12px 12px 0 12px; padding: 10px; max-width: 80%; font-weight: 700; box-shadow: 2px 2px 0px var(--border-color); }
        .chat-bubble-other { background-color: #FFF; color: var(--text-main); border: 2px solid var(--border-color); border-radius: 12px 12px 12px 0; padding: 10px; max-width: 80%; font-weight: 700; box-shadow: 2px 2px 0px var(--border-color); }
    </style>
</head>
<body>

    <div id="app-container">
        
        <header class="absolute top-0 left-0 right-0 z-40 flex justify-between items-center px-4 py-4 pointer-events-none">
            <h1 class="text-3xl font-black text-white pointer-events-auto" style="-webkit-text-stroke: 1.5px black; text-shadow: 3px 3px 0px #000;">
                TOLOOT<span class="text-[var(--primary)]" style="-webkit-text-stroke: 1px black;">.</span>
            </h1>
            <div class="pointer-events-auto flex items-center gap-2">
                <div id="userRepHeader" class="hidden bg-white border-[3px] border-black px-2 py-1 rounded-lg flex items-center shadow-[2px_2px_0px_#000]">
                    <span class="text-xs">⭐</span><span id="hdrRep" class="text-sm font-black ml-1">0</span>
                </div>
                <button onclick="toggleNotifications()" class="bg-white border-[3px] border-black w-10 h-10 flex items-center justify-center rounded-lg relative shadow-[2px_2px_0px_#000] active:translate-y-1 active:shadow-none transition-all">
                    <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <div id="notifBadge" class="absolute -top-1 -right-1 w-3 h-3 bg-[var(--danger)] border-2 border-black rounded-full hidden"></div>
                </button>
            </div>
        </header>

        <div id="view-feed" class="view-section active">
            
            <div id="categoryFilterWrapper" class="absolute top-16 right-4 z-40 pointer-events-auto bg-white/80 backdrop-blur border-[3px] border-black rounded-xl shadow-[4px_4px_0px_rgba(0,0,0,1)]">
                <select id="categorySelect" onchange="setCategoryFilter(this.value)" class="bg-transparent text-black font-black uppercase text-xs outline-none cursor-pointer py-2 pl-3 pr-8 appearance-none">
                </select>
                <svg class="w-4 h-4 absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </div>

            <div class="w-full h-full relative bg-black">
                <div id="feedContainer" class="feed-container"></div>
                <div id="feedEmpty" class="hidden h-full flex flex-col items-center justify-center text-center p-8 bg-[var(--bg-color)]">
                    <div class="neo-panel p-6 flex flex-col items-center">
                        <svg class="w-12 h-12 mb-4 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <p class="text-xl font-black uppercase">Vacío</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-chats" class="view-section bg-[var(--bg-color)]">
            <div class="px-5 w-full">
                <h2 class="text-3xl font-black mb-6 uppercase" style="-webkit-text-stroke: 1px black; color: white; text-shadow: 2px 2px 0px #000;">Chats</h2>
                <div id="chatsListContainer" class="flex flex-col gap-4"></div>
                <div id="chatsEmpty" class="hidden neo-panel p-6 text-center mt-10">
                    <p class="font-black uppercase mb-2">Buzón Vacío</p>
                </div>
            </div>
        </div>

        <div id="view-backpack" class="view-section inventory-view bg-[var(--bg-color)]">
            <div class="flex-1 overflow-y-auto px-4 py-2 flex flex-col relative w-full pb-8">
                <div class="flex justify-between items-end mb-4 mt-2">
                    <div>
                        <h2 class="text-2xl font-black uppercase" style="-webkit-text-stroke: 1px black; color: white; text-shadow: 2px 2px 0px #000;">Mostrador</h2>
                        <span class="bg-[var(--primary)] text-black border-2 border-black font-black px-2 rounded shadow-[2px_2px_0px_#000] text-[10px]" id="layoutScoreDisplay">PTS: 0</span>
                    </div>
                    <button onclick="openAddItemModal()" class="px-3 py-1.5 text-xs neo-btn neo-btn-primary">+ Nuevo</button>
                </div>
                <div class="p-2 neo-panel flex justify-center w-full">
                    <div id="grid-public-container" class="flex justify-center touch-none w-full"><div id="grid-public" class="re-grid" data-grid="public"></div></div>
                </div>
            </div>

            <div id="drawer-handle" class="w-full h-8 bg-black cursor-ns-resize flex items-center justify-center shrink-0 border-t-4 border-black rounded-t-xl touch-none z-20">
                <div class="w-16 h-1.5 bg-white rounded-full"></div>
            </div>

            <div id="private-area" class="h-[40vh] overflow-y-auto px-4 py-4 bg-white shrink-0 flex flex-col relative w-full pb-20 z-10 border-t-4 border-black">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-black uppercase text-black">Mochila Privada</h2>
                </div>
                <div class="p-2 bg-[var(--panel-bg)] border-[3px] border-black rounded-xl flex justify-center shadow-inner">
                     <div id="grid-private-container" class="flex justify-center touch-none w-full"><div id="grid-private" class="re-grid" data-grid="private"></div></div>
                </div>
            </div>
        </div>

        <div id="view-profile" class="view-section bg-[var(--bg-color)]">
            <div class="px-5 w-full">
                <h2 class="text-3xl font-black mb-6 uppercase" style="-webkit-text-stroke: 1px black; color: white; text-shadow: 2px 2px 0px #000;">Perfil</h2>
                <div class="neo-panel p-6">
                    <div class="flex justify-center mb-6">
                        <div class="relative cursor-pointer group" onclick="document.getElementById('profilePicInput').click()">
                            <img id="profilePreview" src="" class="w-24 h-24 object-cover rounded-xl border-[3px] border-black shadow-[4px_4px_0px_#000] bg-white">
                            <input type="file" id="profilePicInput" class="hidden" accept="image/*" onchange="handleProfilePic(event)">
                        </div>
                    </div>
                    <div class="flex justify-center gap-4 mb-6">
                        <div class="bg-white border-[3px] border-black rounded-lg p-3 text-center flex-1 shadow-[2px_2px_0px_#000]">
                            <p class="text-[10px] font-black uppercase mb-1">Exitosos</p>
                            <p class="text-2xl font-black text-[var(--secondary)]" style="-webkit-text-stroke: 1px black;" id="profRepText">0</p>
                        </div>
                        <div class="bg-white border-[3px] border-black rounded-lg p-3 text-center flex-1 shadow-[2px_2px_0px_#000]">
                            <p class="text-[10px] font-black uppercase mb-1">Puntos</p>
                            <p class="text-2xl font-black text-[var(--primary)]" style="-webkit-text-stroke: 1px black;" id="profLayoutText">0</p>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <input type="text" id="profName" class="w-full neo-input" placeholder="Nombre">
                        <textarea id="profStatus" rows="2" class="w-full neo-input resize-none" placeholder="Busco/Ofrezco..."></textarea>
                        <button onclick="saveProfile()" class="py-3 w-full neo-btn neo-btn-primary">Guardar</button>
                        <button onclick="logout()" class="py-3 w-full neo-btn bg-white">Salir</button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="absolute bottom-4 left-1/2 transform -translate-x-1/2 neo-panel px-2 py-2 flex space-x-2 z-30 shadow-[4px_4px_0px_#000] items-center w-[90%] justify-between">
            <button onclick="switchTab('feed')" class="nav-btn w-12 h-12 rounded-lg flex items-center justify-center transition-all border-2 border-transparent active" data-tab="feed">
                <svg class="w-6 h-6 nav-icon text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <button onclick="requireAuth('chats')" class="nav-btn w-12 h-12 rounded-lg flex items-center justify-center transition-all border-2 border-transparent" data-tab="chats">
                <svg class="w-6 h-6 nav-icon text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </button>
            <button onclick="requireAuth('backpack')" class="nav-btn w-12 h-12 rounded-lg flex items-center justify-center transition-all border-2 border-transparent" data-tab="backpack">
                <svg class="w-6 h-6 nav-icon text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </button>
            <button onclick="requireAuth('profile')" class="nav-btn w-12 h-12 rounded-lg flex items-center justify-center transition-all border-2 border-transparent" data-tab="profile">
                <svg class="w-6 h-6 nav-icon text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </button>
        </nav>

        <div id="notifModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex flex-col items-center justify-start pt-16 px-4">
            <div class="w-full neo-panel p-4 flex flex-col max-h-[75vh]">
                <div class="flex justify-between items-center mb-4 border-b-2 border-black pb-2">
                    <span class="font-black uppercase text-xl">Notificaciones</span>
                    <button onclick="toggleNotifications()" class="w-8 h-8 border-[3px] border-black bg-[var(--danger)] text-white font-black">X</button>
                </div>
                <div id="notifList" class="overflow-y-auto space-y-3"></div>
            </div>
        </div>

        <div id="tradeModal" class="absolute inset-0 bg-[var(--bg-color)] z-[70] hidden flex flex-col">
            <div class="p-3 border-b-[3px] border-black bg-white flex justify-between items-center">
                <span class="font-black uppercase text-lg">Mesa de Truque</span>
                <button onclick="closeTradeModal()" class="w-8 h-8 border-[3px] border-black bg-[var(--danger)] text-white font-black">X</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-5">
                <div class="neo-panel p-3 relative bg-white">
                    <div class="absolute -top-3 left-4 bg-[var(--secondary)] border-[3px] border-black px-2 py-0.5 text-xs font-black uppercase text-black" id="tradeOtherName">Recibes</div>
                    <div id="tradeTheirSelected" class="flex flex-wrap gap-2 min-h-[50px] mt-2"></div>
                </div>
                <div class="text-center font-black text-2xl">⇅</div>
                <div class="neo-panel p-3 relative bg-white">
                    <div class="absolute -top-3 left-4 bg-[var(--primary)] border-[3px] border-black px-2 py-0.5 text-xs font-black uppercase text-black">Tus Objetos</div>
                    <div id="tradeMySelected" class="flex flex-wrap gap-2 min-h-[50px] mt-2"></div>
                </div>
                <div class="space-y-3 pt-2">
                    <div class="bg-white border-[3px] border-black p-2 rounded-xl"><h3 class="text-[10px] font-black uppercase mb-1" id="tradeTheirInvTitle">Su Mostrador</h3><div id="tradeTheirInventory" class="flex overflow-x-auto space-x-2 pb-2 hide-scrollbar"></div></div>
                    <div class="bg-white border-[3px] border-black p-2 rounded-xl"><h3 class="text-[10px] font-black uppercase mb-1">Tu Mostrador</h3><div id="tradeMyInventory" class="flex overflow-x-auto space-x-2 pb-2 hide-scrollbar"></div></div>
                </div>
            </div>
            <div class="p-4 bg-white border-t-[3px] border-black flex space-x-2">
                <button onclick="declineTrade()" class="w-14 h-14 shrink-0 neo-btn neo-btn-danger text-xl">X</button>
                <div id="tradeActionButtons" class="flex-1 flex gap-2">
                    <!-- Los botones dinámicos de turnos se insertan aquí -->
                </div>
            </div>
        </div>
        
        <!-- MODAL DETALLE DE OBJETO -->
        <div id="itemDetailModal" class="absolute inset-0 bg-black/90 z-[75] hidden flex flex-col items-center justify-center p-4">
            <div class="neo-panel w-full max-w-sm flex flex-col p-3 relative bg-white shadow-[8px_8px_0px_#000]">
                <button onclick="closeItemDetail()" class="absolute -top-3 -right-3 w-10 h-10 border-[3px] border-black rounded-full bg-[var(--danger)] text-white font-black z-10 hover:scale-105 active:scale-95 transition-transform">X</button>
                <div class="h-64 w-full border-[3px] border-black rounded-lg overflow-hidden bg-black mb-3">
                    <img id="detailImg" src="" class="w-full h-full object-contain">
                </div>
                <div class="p-2 text-center">
                    <h3 id="detailName" class="font-black text-3xl uppercase leading-none mb-2">Nombre</h3>
                    <p id="detailCat" class="text-xs font-black uppercase bg-[var(--primary)] border-[3px] border-black px-2 py-1 rounded inline-block mb-2">Categoría</p>
                    <p id="detailLoc" class="text-sm font-bold text-[var(--text-light)]">Ubicación</p>
                </div>
            </div>
        </div>

        <div id="chatModal" class="absolute inset-0 bg-[var(--bg-color)] z-[80] hidden flex flex-col">
            <div class="p-3 bg-white border-b-[3px] border-black flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <img id="chatTitleImg" src="" class="w-8 h-8 rounded-full border-2 border-black object-cover">
                    <span id="chatTitle" class="font-black uppercase">Chat</span>
                </div>
                <div class="flex gap-2">
                    <button id="btnConcluirTrato" onclick="openConclusionModal()" class="px-2 py-1 neo-btn neo-btn-primary text-[10px]">Cerrar Trato</button>
                    <button onclick="closeChat()" class="w-8 h-8 border-[3px] border-black bg-[var(--danger)] text-white font-black">X</button>
                </div>
            </div>
            
            <div id="chatTradeBanner" class="hidden bg-[var(--panel-bg)] border-b-[3px] border-black p-2 flex justify-between items-center shadow-inner">
                 <div class="flex gap-2 overflow-x-auto hide-scrollbar" id="chatMiniTradeImages"></div>
                 <button onclick="reopenTradeFromChat()" class="neo-btn text-[10px] py-1 px-2 bg-white shrink-0">Mesa</button>
            </div>

            <div id="chatActionBanner" class="bg-black text-white p-2 hidden text-center text-xs font-black uppercase"></div>
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col bg-white/50"></div>
            
            <div id="chatInputContainer" class="p-3 bg-white border-t-[3px] border-black flex space-x-2">
                <input type="text" id="chatInput" placeholder="Escribe..." class="flex-1 neo-input text-sm">
                <button onclick="sendChatMessage()" class="w-12 h-12 neo-btn neo-btn-primary text-xl">➤</button>
            </div>
        </div>

        <div id="conclusionModal" class="fixed inset-0 bg-black/80 z-[85] hidden flex flex-col items-center justify-center p-4">
            <div class="neo-panel w-full max-w-sm flex flex-col p-5 gap-3">
                <h3 class="font-black uppercase text-xl text-center mb-2">Fin del Trato</h3>
                <button onclick="finalizeTransaction('success')" class="w-full py-3 neo-btn neo-btn-success">Éxito (Resta Stock)</button>
                <button onclick="finalizeTransaction('cancelled')" class="w-full py-3 neo-btn bg-white">Cancelar</button>
                <button onclick="openConclusionModal(); closeConclusionModal()" class="w-full py-3 neo-btn neo-btn-danger">Atrás</button>
            </div>
        </div>

        <div id="addItemModal" class="absolute inset-0 bg-[var(--bg-color)] z-[90] hidden flex flex-col">
            <div class="p-4 bg-white border-b-[3px] border-black flex justify-between items-center">
                <span class="font-black uppercase text-xl">Nuevo Item</span>
                <button onclick="closeAddItemModal()" class="w-8 h-8 border-[3px] border-black text-black bg-[var(--danger)] text-white font-black">X</button>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto flex-1">
                <input type="text" id="newItemName" placeholder="Objeto" class="w-full neo-input">
                <div class="flex gap-2">
                    <select id="newItemCategory" class="w-full neo-input flex-1">
                        <option value="Antigüedades">Antigüedades</option>
                        <option value="Cartas/TCG">Cartas/TCG</option>
                        <option value="Juguetes/Figuras">Juguetes/Figuras</option>
                        <option value="Cómics/Libros">Cómics/Libros</option>
                        <option value="Electrónica">Electrónica</option>
                        <option value="Otros">Otros</option>
                    </select>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjlyxlJroTZzYb6Oc3rHe5SUULxcpe5fI",
            authDomain: "toloot.firebaseapp.com",
            projectId: "toloot",
            storageBucket: "toloot.firebasestorage.app",

        let unsubPrivate = null, unsubUsers = null, unsubPublic = null, unsubOffers = null, unsubChats = null;

        let cellWidth = 0; let cellHeight = 0;

        function initCategoryFilter() {

        window.closeLogin = () => document.getElementById('loginOverlay').classList.add('hidden');

        const handle = document.getElementById('drawer-handle');
        const privateArea = document.getElementById('private-area');
        let isResizingDrawer = false; let startY, startHeight;
        const startResize = (e) => { isResizingDrawer = true; startY = e.clientY || (e.touches && e.touches[0].clientY); startHeight = privateArea.getBoundingClientRect().height; };
        const doResize = (e) => {
            if (!isResizingDrawer) return;
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            let newHeight = startHeight - (cy - startY);
            if (newHeight > window.innerHeight * 0.70) newHeight = window.innerHeight * 0.70;

        const stopResize = () => { isResizingDrawer = false; };
        handle.addEventListener('pointerdown', startResize); document.addEventListener('pointermove', doResize, {passive: false}); document.addEventListener('pointerup', stopResize);
        handle.addEventListener('touchstart', startResize); document.addEventListener('touchmove', doResize, {passive: false}); document.addEventListener('touchend', stopResize);

        window.handleLoginClick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { showMessage("Error en login", true); } };
        window.logout = async () => { try { await signOut(auth); inventory = { private: [], public: [] }; switchTab('feed'); } catch (e) {} };

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('loadingOverlay').style.display = 'none';
            if(unsubPrivate) unsubPrivate(); if(unsubUsers) unsubUsers(); if(unsubPublic) unsubPublic(); if(unsubOffers) unsubOffers(); if(unsubChats) unsubChats();
            if (user) {
                currentUser = user; document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('userRepHeader').classList.remove('hidden');
                await ensureUserProfile(user.uid); startRealtimeListeners();
            } else {
                currentUser = null; document.getElementById('userRepHeader').classList.add('hidden');
                loadPublicDataGuest();
            }
        });

        window.handleMultiplePhotos = (event) => {
            const files = Array.from(event.target.files); if (!files.length) return;
            const remaining = 4 - currentItemPhotos.length; const filesToProcess = files.slice(0, remaining);
            if(files.length > remaining) showMessage("Máx 4 fotos.", true);
            filesToProcess.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height; const MAX = 600;
                        if (w > h && w > MAX) { h *= MAX / w; w = MAX; } else if (h > MAX) { w *= MAX / h; h = MAX; }
                        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        currentItemPhotos.push(canvas.toDataURL('image/jpeg', 0.6)); renderPhotoPreviews();
                    }; img.src = e.target.result;
                }; reader.readAsDataURL(file);
            });
        };

        function renderPhotoPreviews() {
            const c = document.getElementById('photoPreviewsContainer');
            if (currentItemPhotos.length === 0) { c.classList.add('hidden'); return; }
            c.classList.remove('hidden');
            c.innerHTML = currentItemPhotos.map((p, i) => `<div class="relative w-16 h-16 shrink-0 border-[3px] border-black rounded-lg overflow-hidden"><img src="${p}" class="w-full h-full object-cover"><button onclick="removePhoto(${i})" class="absolute top-0 right-0 bg-[var(--danger)] text-white w-5 h-5 flex items-center justify-center font-black">X</button></div>`).join('');
        }
        window.removePhoto = (i) => { currentItemPhotos.splice(i, 1); renderPhotoPreviews(); };

        window.handleProfilePic = (event) => {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let w = img.width, h = img.height; const MAX = 400; 
                    if (w > h && w > MAX) { h *= MAX / w; w = MAX; } else if (h > MAX) { w *= MAX / h; h = MAX; }
                    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    myProfile.photoURL = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('profilePreview').src = myProfile.photoURL; saveProfile(false);
                }; img.src = e.target.result;
            }; reader.readAsDataURL(file);
        };

        async function ensureUserProfile(uid) {
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', uid);
            try {
                const snap = await getDoc(userRef);
                if (snap.exists()) myProfile = { ...snap.data(), layoutScore: snap.data().layoutScore || 0 };
                else {
                    myProfile.displayName = currentUser.displayName || 'Usuario';
                    myProfile.photoURL = currentUser.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${uid}`;
                    myProfile.successfulTrades = 0; myProfile.reports = []; myProfile.layoutScore = 0;
                    await setDoc(userRef, myProfile);
                }
                updateProfileUI();
            } catch (e) {}
        }

        window.saveProfile = async (showMsg = true) => {
            if(!currentUser) return;
            myProfile.displayName = document.getElementById('profName').value; myProfile.status = document.getElementById('profStatus').value;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid), myProfile, {merge:true});
                updateProfileUI(); if(showMsg) showMessage("Perfil guardado");
            } catch (e) { if(showMsg) showMessage("Error", true); }
        };

        function updateProfileUI() {
            document.getElementById('profName').value = myProfile.displayName || ''; document.getElementById('profStatus').value = myProfile.status || '';
            document.getElementById('profilePreview').src = myProfile.photoURL || ''; document.getElementById('profRepText').innerText = myProfile.successfulTrades || 0;
            document.getElementById('hdrRep').innerText = myProfile.successfulTrades || 0; document.getElementById('profLayoutText').innerText = myProfile.layoutScore || 0;
            document.getElementById('layoutScoreDisplay').innerText = `PTS: ${myProfile.layoutScore || 0}`;
        }

        async function loadPublicDataGuest() {
            unsubUsers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => { allUsers = {}; snap.forEach(doc => allUsers[doc.id] = doc.data()); renderFeed(); }, (e) => {});
            unsubPublic = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'publicItems'), (snap) => { allPublicItems = []; snap.forEach(doc => allPublicItems.push({ ...doc.data(), id: doc.id })); renderFeed(); }, (e) => {});
        }

        async function calculateTetrisScore() {
            if(!currentUser) return;
            let grid = Array(GRID_ROWS).fill(0).map(() => Array(GRID_COLS).fill(false));
            inventory.public.forEach(i => {
                for(let y=0; y<i.h; y++){ for(let x=0; x<i.w; x++){ if(i.y+y < GRID_ROWS && i.x+x < GRID_COLS) grid[i.y+y][i.x+x] = true; } }
            });
            let fullRows = 0; for(let y=0; y<GRID_ROWS; y++) { if(grid[y].every(c => c)) fullRows++; }
            let fullCols = 0; for(let x=0; x<GRID_COLS; x++) { if(grid.every(r => r[x])) fullCols++; }
            let score = (fullRows * 50) + (fullCols * 50) + (inventory.public.length * 5);
            if(myProfile.layoutScore !== score) { myProfile.layoutScore = score; updateProfileUI(); await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid), { layoutScore: score }); }
        }

        function startRealtimeListeners() {
            unsubPrivate = onSnapshot(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'privateItems'), (snap) => { inventory.private = []; snap.forEach(doc => inventory.private.push({ ...doc.data(), id: doc.id })); renderGrids(); }, (e) => {});
            unsubUsers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                allUsers = {}; snap.forEach(doc => { allUsers[doc.id] = doc.data(); }); renderFeed();
                if(document.getElementById('view-chats').classList.contains('active')) renderChatsView();
                if(myProfile.successfulTrades !== allUsers[currentUser.uid]?.successfulTrades || myProfile.layoutScore !== allUsers[currentUser.uid]?.layoutScore) { myProfile.successfulTrades = allUsers[currentUser.uid]?.successfulTrades || 0; myProfile.layoutScore = allUsers[currentUser.uid]?.layoutScore || 0; updateProfileUI(); }
            }, (e) => {});
            unsubPublic = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'publicItems'), (snap) => {
                allPublicItems = []; inventory.public = [];
                snap.forEach(doc => { const item = { ...doc.data(), id: doc.id }; allPublicItems.push(item); if (item.uid === currentUser.uid) inventory.public.push(item); });
                renderGrids(); renderFeed(); calculateTetrisScore(); 
                if(currentTradeOfferId) renderTradeModal(currentTradeOfferId);
                if(document.getElementById('view-chats').classList.contains('active')) renderChatsView();
            }, (e) => {});
            unsubOffers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'offers'), (snap) => {
                allOffers = []; snap.forEach(doc => { const d = doc.data(); if(d.initiatorId === currentUser.uid || d.receiverId === currentUser.uid) allOffers.push({ ...d, id: doc.id }); });
                updateNotifBadge(); renderNotifList(); if(currentTradeOfferId) renderTradeModal(currentTradeOfferId); if(currentChatId) renderChatModal(currentChatId);
            }, (e) => {});
            unsubChats = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'chats'), (snap) => {
                allChats = []; snap.forEach(doc => { const d = doc.data(); if(d.participants && d.participants.includes(currentUser.uid)) allChats.push({ ...d, id: doc.id }); });
                renderNotifList(); if(document.getElementById('view-chats').classList.contains('active')) renderChatsView(); if(currentChatId) renderChatModal(currentChatId);
            }, (e) => {});
        }

        function resizeGrids() {
            const container = document.getElementById('view-backpack'); if(!container) return;
            const appW = document.getElementById('app-container').clientWidth;
            let aw = Math.min(appW - 32, 400); cellWidth = Math.floor(aw / GRID_COLS); cellHeight = cellWidth; 
            document.querySelectorAll('.re-grid').forEach(g => {
                g.style.gridTemplateColumns = `repeat(${GRID_COLS}, ${cellWidth}px)`; g.style.gridTemplateRows = `repeat(${GRID_ROWS}, ${cellHeight}px)`;
                g.style.width = `${cellWidth * GRID_COLS}px`; g.style.height = `${cellHeight * GRID_ROWS}px`;
                g.innerHTML = ''; for(let i=0; i<GRID_COLS*GRID_ROWS; i++) { const c = document.createElement('div'); c.className = 're-cell'; g.appendChild(c); }
            }); renderGrids();
        }

        function renderGrids() {
            if (cellWidth === 0) return;
            const draw = (items, gridId) => {
                const c = document.getElementById(gridId); if(!c) return;
                c.querySelectorAll('.re-item').forEach(el => el.remove());
                items.forEach(item => {
                    const div = document.createElement('div'); div.className = 're-item';
                    div.style.width = `${(item.w * cellWidth) - 4}px`; div.style.height = `${(item.h * cellHeight) - 4}px`;
                    div.style.left = `${item.x * cellWidth + 2}px`; div.style.top = `${item.y * cellHeight + 2}px`;
                    div.dataset.id = item.id; div.dataset.grid = gridId === 'grid-private' ? 'private' : 'public';
                    if(item.photos && item.photos[0]) { const img = document.createElement('img'); img.src = item.photos[0]; div.appendChild(img); }
                    if(item.quantity > 1) { div.innerHTML += `<span class="absolute top-0.5 right-0.5 bg-black text-white font-black text-[9px] px-1 rounded">x${item.quantity}</span>`; }
                    div.addEventListener('pointerdown', handleDragStart); c.appendChild(div);
                });
            };
            draw(inventory.private, 'grid-private'); draw(inventory.public, 'grid-public');
        }

        let isDraggingItem = false, dragItemData = null, dragClone = null, dragOffset = {x:0, y:0};
        let dragStartX = 0, dragStartY = 0, dragStartTime = 0;

        function handleDragStart(e) {
            if (e.button !== 0 && e.type !== 'touchstart' && !e.pointerType) return;
            isDraggingItem = true; dragItemData = (e.currentTarget.dataset.grid === 'private' ? inventory.private : inventory.public).find(i => i.id === e.currentTarget.dataset.id);
            if(!dragItemData) return;
            const cx = e.clientX ?? (e.touches && e.touches[0].clientX); const cy = e.clientY ?? (e.touches && e.touches[0].clientY);
            dragStartX = cx; dragStartY = cy; dragStartTime = Date.now();
            document.body.style.overflow = 'hidden';
            e.currentTarget.style.opacity = '0.3'; const rect = e.currentTarget.getBoundingClientRect();
            dragOffset.x = cx - rect.left; dragOffset.y = cy - rect.top;
            dragClone = e.currentTarget.cloneNode(true); dragClone.className = 're-item drag-clone';
            dragClone.style.width = `${rect.width}px`; dragClone.style.height = `${rect.height}px`;
            dragClone.style.left = `${cx - dragOffset.x}px`; dragClone.style.top = `${cy - dragOffset.y}px`;
            document.body.appendChild(dragClone);
            document.addEventListener('pointermove', handleItemDragMove, {passive: false}); document.addEventListener('pointerup', handleItemDragEnd);
            document.addEventListener('touchmove', handleItemDragMove, {passive: false}); document.addEventListener('touchend', handleItemDragEnd);
        }
        function handleItemDragMove(e) {
            if (!isDraggingItem || !dragClone) return;
            const cx = e.clientX ?? (e.touches && e.touches[0].clientX); const cy = e.clientY ?? (e.touches && e.touches[0].clientY);
            dragClone.style.left = `${cx - dragOffset.x}px`; dragClone.style.top = `${cy - dragOffset.y}px`; e.preventDefault(); 
        }
        async function handleItemDragEnd(e) {
            if (!isDraggingItem) return; isDraggingItem = false;
            document.removeEventListener('pointermove', handleItemDragMove); document.removeEventListener('pointerup', handleItemDragEnd);
            document.removeEventListener('touchmove', handleItemDragMove); document.removeEventListener('touchend', handleItemDragEnd);
            document.body.style.overflow = '';
            const cx = e.clientX ?? (e.changedTouches && e.changedTouches[0].clientX); const cy = e.clientY ?? (e.changedTouches && e.changedTouches[0].clientY);
            dragClone?.remove(); dragClone = null; renderGrids(); 

            const oldGridType = inventory.private.find(i => i.id === dragItemData.id) ? 'private' : 'public';
            const oldItems = oldGridType === 'private' ? inventory.private : inventory.public;

            if (Date.now() - dragStartTime < 250 && Math.hypot(cx - dragStartX, cy - dragStartY) < 10) {
                const newW = dragItemData.h; const newH = dragItemData.w;
                const canRotate = !oldItems.some(i => i.id !== dragItemData.id && dragItemData.x < i.x + i.w && dragItemData.x + newW > i.x && dragItemData.y < i.y + i.h && dragItemData.y + newH > i.y) && (dragItemData.x + newW <= GRID_COLS) && (dragItemData.y + newH <= GRID_ROWS);
                if(canRotate) { const path = oldGridType === 'public' ? ['public','data','publicItems'] : ['users',currentUser.uid,'privateItems']; updateDoc(doc(db, 'artifacts', appId, ...path, dragItemData.id), { w: newW, h: newH }); } else { showMessage("No hay espacio", true); } return;
            }

            const pubRect = document.getElementById('grid-public').getBoundingClientRect(); const privRect = document.getElementById('grid-private').getBoundingClientRect();
            let targetGridType = null; let targetRect = null;
            if (cx >= pubRect.left && cx <= pubRect.right && cy >= pubRect.top && cy <= pubRect.bottom) { targetGridType = 'public'; targetRect = pubRect; } 
            else if (cx >= privRect.left && cx <= privRect.right && cy >= privRect.top && cy <= privRect.bottom) { targetGridType = 'private'; targetRect = privRect; }

            if (targetGridType) {
                let cellX = Math.round(((cx - dragOffset.x) - targetRect.left) / cellWidth); let cellY = Math.round(((cy - dragOffset.y) - targetRect.top) / cellHeight);
                const items = targetGridType === 'private' ? inventory.private : inventory.public;
                const isValid = (tx, ty) => {
                    if (tx < 0 || ty < 0 || tx + dragItemData.w > GRID_COLS || ty + dragItemData.h > GRID_ROWS) return false;
                    return !items.some(i => i.id !== dragItemData.id && tx < i.x + i.w && tx + dragItemData.w > i.x && ty < i.y + i.h && ty + dragItemData.h > i.y);
                };
                if (isValid(cellX, cellY)) {
                    const newItemData = { ...dragItemData, x: cellX, y: cellY }; delete newItemData.id;
                    try {
                        if (oldGridType !== targetGridType) {
                            const deletePath = oldGridType === 'public' ? ['public','data','publicItems'] : ['users',currentUser.uid,'privateItems'];
                            const addPath = targetGridType === 'public' ? ['public','data','publicItems'] : ['users',currentUser.uid,'privateItems'];
                            await deleteDoc(doc(db, 'artifacts', appId, ...deletePath, dragItemData.id)); await setDoc(doc(db, 'artifacts', appId, ...addPath, dragItemData.id), newItemData);
                        } else {
                            const path = oldGridType === 'public' ? ['public','data','publicItems'] : ['users',currentUser.uid,'privateItems'];
                            await setDoc(doc(db, 'artifacts', appId, ...path, dragItemData.id), newItemData, { merge: true });
                        }
                    } catch (e) {}
                } else showMessage("Espacio ocupado", true);
            }
        }

        window.openAddItemModal = () => { currentItemPhotos = []; renderPhotoPreviews(); document.getElementById('cameraInput').value = ''; document.getElementById('addItemModal').classList.remove('hidden'); };
        window.closeAddItemModal = () => document.getElementById('addItemModal').classList.add('hidden');
        window.submitNewItem = async () => {
            if(!currentUser) return;
            const name = document.getElementById('newItemName').value.trim(); const loc = document.getElementById('newItemLocation').value.trim();
            const cat = document.getElementById('newItemCategory').value; const sizeStr = document.getElementById('newItemSize').value;
            const quantity = parseInt(document.getElementById('newItemQuantity').value) || 1;
            if(!name || !loc || currentItemPhotos.length === 0) return showMessage("Faltan datos", true);
            const [w, h] = sizeStr.split(',').map(Number); let tx = 0, ty = 0, found = false;
            for(let y=0; y<=GRID_ROWS-h; y++) {
                for(let x=0; x<=GRID_COLS-w; x++) { if(!inventory.private.some(i => x < i.x + i.w && x + w > i.x && y < i.y + i.h && y + h > i.y)) { tx = x; ty = y; found = true; break; } } if(found) break;
            }
            if(!found) return showMessage("Privado lleno", true);
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'privateItems'), { uid: currentUser.uid, name, location: loc, category: cat, photos: currentItemPhotos, w, h, x: tx, y: ty, quantity });
                closeAddItemModal(); document.getElementById('newItemName').value = ''; document.getElementById('newItemLocation').value = ''; document.getElementById('newItemQuantity').value = '1'; showMessage("Guardado");
            } catch (e) {}
        };

        window.handleCarouselScroll = (el) => {
            const index = Math.round(el.scrollLeft / el.clientWidth);
            const dots = el.parentElement.querySelectorAll('.car-dot'); dots.forEach((dot, i) => { if(i === index) dot.classList.add('active'); else dot.classList.remove('active'); });
        };
        window.toggleFeedCard = (el) => { el.classList.toggle('expanded'); };

        function renderFeed() {
            const container = document.getElementById('feedContainer'); const emptyState = document.getElementById('feedEmpty');
            let feedItems = currentUser ? allPublicItems.filter(item => item.uid !== currentUser.uid) : allPublicItems;
            if (activeCategoryFilter !== 'Todo') { feedItems = feedItems.filter(item => item.category === activeCategoryFilter); }
            if (feedItems.length === 0) { container.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden'); container.innerHTML = '';
            feedItems.sort((a, b) => { const scoreA = allUsers[a.uid]?.layoutScore || 0; const scoreB = allUsers[b.uid]?.layoutScore || 0; return scoreB - scoreA; });

            feedItems.forEach(item => {
                const user = allUsers[item.uid] || { displayName: 'Anónimo', photoURL: '', successfulTrades: 0, layoutScore: 0 };
                const post = document.createElement('div'); post.className = 'feed-item';
                const photosHtml = item.photos.map(p => `<div class="feed-photo-container"><img src="${p}" class="feed-photo"></div>`).join('');
                const dotsHtml = item.photos.length > 1 ? `<div class="carousel-indicators">${item.photos.map((_, i) => `<div class="car-dot ${i===0?'active':''}"></div>`).join('')}</div>` : '';

                post.innerHTML = `
                    <div class="feed-carousel hide-scrollbar" onscroll="handleCarouselScroll(this)">${photosHtml}</div>
                    ${dotsHtml}
                    <div class="feed-gradient"></div>
                    <div class="feed-card" onclick="toggleFeedCard(this)">
                        <div class="flex items-center space-x-3 mb-2">
                            <img src="${user.photoURL}" class="w-10 h-10 rounded border-2 border-black object-cover bg-white">
                            <div class="flex-1 overflow-hidden">
                                <h3 class="text-sm font-black truncate">${user.displayName} <span class="bg-[var(--primary)] px-1 rounded border-2 border-black ml-1">⭐${user.successfulTrades||0}</span></h3>
                                <p class="text-[10px] font-black uppercase truncate mt-0.5 text-[var(--text-light)]">${item.location}</p>
                            </div>
                        </div>
                        <h2 class="text-2xl font-black truncate mt-1">${item.name} ${item.quantity > 1 ? `<span class="text-xs bg-black text-white px-1 rounded align-middle">x${item.quantity}</span>` : ''}</h2>
                        <span class="text-[10px] font-black uppercase bg-white border-2 border-black px-1 mt-1 inline-block rounded">${item.category || 'Varios'}</span>
                    </div>
                    <div class="absolute bottom-[90px] right-4 flex flex-col space-y-4 z-20">
                        <button onclick="${currentUser ? `initiateTrade('${item.id}', '${item.uid}', '${item.name.replace(/'/g, "\\'")}')` : `document.getElementById('loginOverlay').classList.remove('hidden')`}" class="w-12 h-12 rounded-full neo-btn neo-btn-success shadow-[4px_4px_0px_#000] border-2 border-black">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(post);
            });
        }

        // ====== SISTEMA DE OFERTAS POR TURNOS ======

        window.initiateTrade = async (targetItemId, targetUserId, targetItemName) => {
            let existingOffer = allOffers.find(o => o.receiverItems.includes(targetItemId) && o.initiatorId === currentUser.uid && o.status === 'negotiating');
            if(existingOffer) { currentTradeOfferId = existingOffer.id; document.getElementById('tradeModal').classList.remove('hidden'); renderTradeModal(existingOffer.id); return; }
            let existingChat = allChats.find(c => { if(c.status !== 'active') return false; const o = allOffers.find(off => off.id === c.offerId); return o && o.receiverItems.includes(targetItemId) && o.initiatorId === currentUser.uid; });
            if(existingChat) { switchTab('chats'); openChat(existingChat.id); return; }
            try {
                // Al iniciar, tu turno es primero para que puedas armar la oferta
                const ref = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'offers'), { 
                    status: 'negotiating', initiatorId: currentUser.uid, receiverId: targetUserId, 
                    initiatorItems: [], receiverItems: [targetItemId], receiverItemName: targetItemName || 'Objeto', 
                    currentTurn: currentUser.uid, dismissedBy: [] 
                });
                currentTradeOfferId = ref.id; document.getElementById('tradeModal').classList.remove('hidden'); renderTradeModal(ref.id);
            } catch(e) { showMessage("Error", true); }
        };

        window.closeTradeModal = () => { document.getElementById('tradeModal').classList.add('hidden'); currentTradeOfferId = null; };

        // Mostrar detalles de objetos
        window.showItemDetails = (itemId) => {
            const item = allPublicItems.find(i => i.id === itemId); if (!item) return;
            document.getElementById('detailImg').src = item.photos[0];
            document.getElementById('detailName').innerText = item.name;
            document.getElementById('detailCat').innerText = item.category || 'Varios';
            document.getElementById('detailLoc').innerText = item.location;
            document.getElementById('itemDetailModal').classList.remove('hidden');
        };
        window.closeItemDetail = () => { document.getElementById('itemDetailModal').classList.add('hidden'); };

        function renderTradeModal(offerId) {
            const offer = allOffers.find(o => o.id === offerId); if(!offer || offer.status === 'cancelled' || offer.status === 'accepted') { closeTradeModal(); return; }
            
            const isInit = offer.initiatorId === currentUser.uid; 
            const otherUId = isInit ? offer.receiverId : offer.initiatorId; 
            const otherUser = allUsers[otherUId];
            
            const myTurn = offer.currentTurn === currentUser.uid;
            const isPendingConf = offer.status === 'pending_confirmation';

            const myItems = isInit ? (offer.initiatorItems||[]) : (offer.receiverItems||[]); 
            const theirItems = isInit ? (offer.receiverItems||[]) : (offer.initiatorItems||[]);
            
            document.getElementById('tradeOtherName').innerText = `De ${otherUser?.displayName || 'Usuario'}`;
            document.getElementById('tradeTheirInvTitle').innerText = `Mostrador de ${otherUser?.displayName || 'Usuario'}`;
            
            // Si no es tu turno, tocas y ves detalle. Si es tu turno y es tuyo, tocas y retiras de la mesa.
            const renderItemTheir = (item) => {
                if(!item) return '';
                return `<div class="w-[50px] h-[50px] bg-white rounded-lg border-2 border-black overflow-hidden cursor-pointer relative" onclick="showItemDetails('${item.id}')"><img src="${item.photos[0]}" class="w-full h-full object-cover"></div>`;
            };
            const renderItemMine = (item) => {
                if(!item) return '';
                return `<div class="w-[50px] h-[50px] bg-white rounded-lg border-2 border-black overflow-hidden cursor-pointer relative" onclick="${myTurn ? `toggleTradeItem('${item.id}', true)` : `showItemDetails('${item.id}')`}"><img src="${item.photos[0]}" class="w-full h-full object-cover"></div>`;
            };
            
            document.getElementById('tradeTheirSelected').innerHTML = theirItems.map(id => renderItemTheir(allPublicItems.find(i=>i.id===id))).join('') || '<span class="text-[10px] font-black uppercase text-[var(--text-light)] py-2">Vacío</span>';
            document.getElementById('tradeMySelected').innerHTML = myItems.map(id => renderItemMine(allPublicItems.find(i=>i.id===id))).join('') || '<span class="text-[10px] font-black uppercase text-[var(--text-light)] py-2">Vacío</span>';
            
            const myFullInventory = allPublicItems.filter(i => i.uid === currentUser.uid); 
            const theirFullInventory = allPublicItems.filter(i => i.uid === otherUId);
            
            // Si no es tu turno, no puedes agregar cosas de los mostradores, solo ves detalle
            const renderInventoryStrip = (inventoryList, selectedArr, isMine) => {
                return inventoryList.map(item => `<div onclick="${myTurn ? `toggleTradeItem('${item.id}', ${isMine})` : `showItemDetails('${item.id}')`}" class="w-[50px] h-[50px] shrink-0 rounded-lg overflow-hidden cursor-pointer border-2 transition-all relative ${selectedArr.includes(item.id)?'border-[var(--primary)] opacity-50':'border-black'}"><img src="${item.photos[0]}" class="w-full h-full object-cover"></div>`).join('') || '<span class="text-[10px] font-black uppercase">Vacío</span>';
            };
            
            document.getElementById('tradeMyInventory').innerHTML = renderInventoryStrip(myFullInventory, myItems, true);
            document.getElementById('tradeTheirInventory').innerHTML = renderInventoryStrip(theirFullInventory, theirItems, false);
            
            // Lógica de botones según turno y estado
            const actionsDiv = document.getElementById('tradeActionButtons');
            if (!myTurn) {
                let msg = isPendingConf ? "ESPERANDO CONFIRMACIÓN..." : "ESPERANDO RESPUESTA...";
                actionsDiv.innerHTML = `<button disabled class="flex-1 py-3 neo-btn bg-gray-300 text-[10px]">${msg}</button>`;
            } else if (isPendingConf) {
                actionsDiv.innerHTML = `
                    <button onclick="modifyTrade()" class="flex-1 py-3 neo-btn bg-white text-[10px]">MODIFICAR</button>
                    <button onclick="confirmTrade()" class="flex-1 py-3 neo-btn neo-btn-success text-[10px]">CONFIRMAR TRATO</button>
                `;
            } else {
                actionsDiv.innerHTML = `
                    <button onclick="passTurn()" class="flex-1 py-3 neo-btn neo-btn-primary text-[10px]">ENVIAR OFERTA</button>
                    <button onclick="acceptTradeStep1()" class="flex-1 py-3 neo-btn neo-btn-success text-[10px]">ACEPTAR TRATO</button>
                `;
            }
        }

        window.toggleTradeItem = async (itemId, isMine) => {
            const offer = allOffers.find(o => o.id === currentTradeOfferId); if(!offer) return;
            if (offer.currentTurn !== currentUser.uid) return; // Si no es tu turno, bloqueado
            const isInit = offer.initiatorId === currentUser.uid;
            let currentItems = isMine ? (isInit ? [...(offer.initiatorItems||[])] : [...(offer.receiverItems||[])]) : (isInit ? [...(offer.receiverItems||[])] : [...(offer.initiatorItems||[])]);
            if(currentItems.includes(itemId)) currentItems = currentItems.filter(id => id !== itemId); else currentItems.push(itemId);
            
            const updates = {};
            if(isMine) { if(isInit) updates.initiatorItems = currentItems; else updates.receiverItems = currentItems; } 
            else { if(isInit) updates.receiverItems = currentItems; else updates.initiatorItems = currentItems; }
            try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', offer.id), updates); } catch(e) {}
        };
        
        window.passTurn = async () => {
            const offer = allOffers.find(o => o.id === currentTradeOfferId);
            const nextTurn = offer.initiatorId === currentUser.uid ? offer.receiverId : offer.initiatorId;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', currentTradeOfferId), {
                    currentTurn: nextTurn, status: 'negotiating', dismissedBy: []
                });
                closeTradeModal(); showMessage("Oferta enviada");
            } catch(e){}
        };

        window.acceptTradeStep1 = async () => {
             const offer = allOffers.find(o => o.id === currentTradeOfferId);
             const nextTurn = offer.initiatorId === currentUser.uid ? offer.receiverId : offer.initiatorId;
             try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', currentTradeOfferId), {
                    currentTurn: nextTurn, status: 'pending_confirmation', dismissedBy: []
                });
                closeTradeModal(); showMessage("Esperando confirmación...");
             } catch(e) {}
        };

        window.modifyTrade = async () => {
            // Rechaza la confirmación y vuelve a negociar sin pasar el turno (te toca a ti)
            try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', currentTradeOfferId), { status: 'negotiating' }); } catch(e){}
        };

        window.confirmTrade = async () => {
            const offer = allOffers.find(o => o.id === currentTradeOfferId);
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', currentTradeOfferId), { status: 'accepted' });
                const chatRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chats'), { participants: [offer.initiatorId, offer.receiverId], messages: [], finishedBy: [], status: 'active', offerId: currentTradeOfferId });
                closeTradeModal(); switchTab('chats'); openChat(chatRef.id);
            } catch(e) {}
        };

        window.declineTrade = async () => { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', currentTradeOfferId), { status: 'cancelled' }); closeTradeModal(); } catch(e) {} };
        
        // ==========================================

        window.toggleNotifications = () => { const el = document.getElementById('notifModal'); el.classList.contains('hidden') ? el.classList.remove('hidden') : el.classList.add('hidden'); };
        function updateNotifBadge() {
            if(!currentUser) return; 
            const pending = allOffers.some(o => (o.status === 'negotiating' || o.status === 'pending_confirmation') && o.currentTurn === currentUser.uid && !(o.dismissedBy || []).includes(currentUser.uid));
            document.getElementById('notifBadge').style.display = pending ? 'block' : 'none';
        }
        function renderNotifList() {
            const list = document.getElementById('notifList'); list.innerHTML = '';
            const visibleOffers = allOffers.filter(o => (o.status === 'negotiating' || o.status === 'pending_confirmation') && !(o.dismissedBy || []).includes(currentUser.uid));
            visibleOffers.forEach(o => {
                const isMyTurn = o.currentTurn === currentUser.uid; 
                const otherUid = o.initiatorId === currentUser.uid ? o.receiverId : o.initiatorId; 
                const name = allUsers[otherUid]?.displayName || 'Alguien';
                
                let actionText = isMyTurn ? (o.status === 'pending_confirmation' ? 'Requiere Confirmación!' : 'Tu turno') : 'Esperando a '+name;

                const div = document.createElement('div');
                div.className = `p-3 neo-panel cursor-pointer relative ${isMyTurn ? 'bg-[var(--primary)]' : 'bg-white opacity-70'}`;
                div.innerHTML = `
                    <p class="font-black text-sm uppercase">Oferta de ${name}</p>
                    <p class="text-xs font-bold">${actionText}</p>
                    <button onclick="event.stopPropagation(); deleteNotif('${o.id}')" class="absolute top-2 right-2 w-6 h-6 border-2 border-black bg-[var(--danger)] text-white font-black flex items-center justify-center">X</button>
                `;
                div.onclick = () => { toggleNotifications(); currentTradeOfferId = o.id; document.getElementById('tradeModal').classList.remove('hidden'); renderTradeModal(o.id); };
                list.appendChild(div);
            });
        }
        window.deleteNotif = async (id) => { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', id), { dismissedBy: arrayUnion(currentUser.uid) }); } catch(e){} };

        function renderChatsView() {
            const container = document.getElementById('chatsListContainer'); const emptyState = document.getElementById('chatsEmpty');
            const visibleChats = allChats.filter(c => !(c.hiddenFor || []).includes(currentUser.uid));
            if(visibleChats.length === 0) { container.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden'); container.innerHTML = '';
            [...visibleChats].reverse().forEach(chat => {
                const otherUid = chat.participants.find(id => id !== currentUser.uid); const user = allUsers[otherUid] || { displayName: 'Usuario', photoURL: '' };
                const isFinished = chat.status && chat.status !== 'active'; const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length-1].text : 'Sin mensajes';
                const div = document.createElement('div');
                div.className = `neo-panel p-4 cursor-pointer relative ${isFinished ? 'opacity-60 bg-gray-200' : 'bg-white'}`;
                div.onclick = () => openChat(chat.id);
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <img src="${user.photoURL}" class="w-12 h-12 rounded-lg object-cover border-2 border-black">
                        <div class="flex-1 overflow-hidden pr-6">
                            <h4 class="font-black text-lg truncate">${user.displayName}</h4>
                            <p class="text-sm truncate text-[var(--text-light)] font-bold">${lastMsg}</p>
                        </div>
                    </div>
                    ${isFinished ? `<button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="absolute top-2 right-2 w-6 h-6 border-2 border-black bg-[var(--danger)] text-white font-black flex items-center justify-center">X</button>` : ''}
                `;
                container.appendChild(div);
            });
        }

        window.openChat = (chatId) => { currentChatId = chatId; document.getElementById('chatModal').classList.remove('hidden'); renderChatModal(chatId); };
        window.closeChat = () => { document.getElementById('chatModal').classList.add('hidden'); currentChatId = null; };

        function renderChatModal(chatId) {
            const chat = allChats.find(c => c.id === chatId); if(!chat) return;
            const otherUid = chat.participants.find(id => id !== currentUser.uid);
            document.getElementById('chatTitleImg').src = allUsers[otherUid]?.photoURL || ''; document.getElementById('chatTitle').innerText = allUsers[otherUid]?.displayName || 'Chat';
            const isFinishedByMe = chat.finishedBy?.includes(currentUser.uid);
            const offer = allOffers.find(o => o.id === chat.offerId);

            if(chat.status === 'active' && !isFinishedByMe) document.getElementById('btnConcluirTrato').classList.remove('hidden'); else document.getElementById('btnConcluirTrato').classList.add('hidden');
            if(chat.status === 'active') document.getElementById('chatInputContainer').classList.remove('hidden'); else document.getElementById('chatInputContainer').classList.add('hidden');

            const banner = document.getElementById('chatActionBanner'); banner.classList.remove('hidden', 'bg-[var(--secondary)]', 'bg-[var(--danger)]', 'bg-[#F59E0B]');
            if (chat.status === 'completed') { banner.innerText = "Éxito"; banner.classList.add('bg-[var(--secondary)]'); } 
            else if (chat.status === 'cancelled') { banner.innerText = "Cancelado"; banner.classList.add('bg-[#F59E0B]'); } 
            else if (isFinishedByMe) { banner.innerText = "Esperando al otro..."; } else { banner.classList.add('hidden'); }
            
            const tradeBanner = document.getElementById('chatTradeBanner'); const miniImages = document.getElementById('chatMiniTradeImages');
            if (chat.status === 'active' && offer) {
                tradeBanner.classList.remove('hidden');
                const itemsToRender = [...(offer.initiatorItems||[]), ...(offer.receiverItems||[])];
                miniImages.innerHTML = itemsToRender.map(id => {
                    const it = allPublicItems.find(i=>i.id===id); return it ? `<img src="${it.photos[0]}" class="w-8 h-8 object-cover rounded border border-black">` : '';
                }).join('');
            } else { tradeBanner.classList.add('hidden'); }

            const msgsBox = document.getElementById('chatMessages');
            msgsBox.innerHTML = chat.messages.map(m => {
                const isMe = m.sender === currentUser.uid;
                return `<div class="w-full flex ${isMe ? 'justify-end' : 'justify-start'}"><div class="${isMe ? 'chat-bubble-me' : 'chat-bubble-other'}">${m.text}</div></div>`;
            }).join('');
            msgsBox.scrollTop = msgsBox.scrollHeight;
        }

        window.sendChatMessage = async () => {
            if(!currentChatId) return; const inp = document.getElementById('chatInput'); const txt = inp.value.trim(); if(!txt) return;
            const chat = allChats.find(c => c.id === currentChatId);
            try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', currentChatId), { messages: [...chat.messages, { sender: currentUser.uid, text: txt }] }); inp.value = ''; } catch(e) {}
        };
        window.reopenTradeFromChat = () => { const chat = allChats.find(c => c.id === currentChatId); if(chat && chat.offerId) { currentTradeOfferId = chat.offerId; document.getElementById('tradeModal').classList.remove('hidden'); renderTradeModal(chat.offerId); } };

        window.openConclusionModal = () => document.getElementById('conclusionModal').classList.remove('hidden');
        window.closeConclusionModal = () => document.getElementById('conclusionModal').classList.add('hidden');

        async function processItemConsumption(offerId) {
            try {
                const offerDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offers', offerId)); if(!offerDoc.exists()) return;
                const offer = offerDoc.data(); const itemsToProcess = [...(offer.initiatorItems||[]), ...(offer.receiverItems||[])];
                for (let itemId of itemsToProcess) {
                    const pubRef = doc(db, 'artifacts', appId, 'public', 'data', 'publicItems', itemId); const itemDocPub = await getDoc(pubRef);
                    if (itemDocPub.exists()) { if (itemDocPub.data().quantity > 1) await updateDoc(pubRef, { quantity: increment(-1) }); else await deleteDoc(pubRef); } 
                    else {
                        const priv1 = doc(db, 'artifacts', appId, 'users', offer.initiatorId, 'privateItems', itemId); const priv1Snap = await getDoc(priv1);
                        if(priv1Snap.exists()) { if(priv1Snap.data().quantity > 1) await updateDoc(priv1, {quantity: increment(-1)}); else await deleteDoc(priv1); continue; }
                        const priv2 = doc(db, 'artifacts', appId, 'users', offer.receiverId, 'privateItems', itemId); const priv2Snap = await getDoc(priv2);
                        if(priv2Snap.exists()) { if(priv2Snap.data().quantity > 1) await updateDoc(priv2, {quantity: increment(-1)}); else await deleteDoc(priv2); }
                    }
                }
            } catch(e) {}
        }

        window.finalizeTransaction = async (type) => {
            if(!currentChatId) return; const chatRef = doc(db, 'artifacts', appId, 'public', 'data', 'chats', currentChatId); const chatData = allChats.find(c => c.id === currentChatId); closeConclusionModal();
            try {
                if(type === 'success') {
                    await updateDoc(chatRef, { finishedBy: arrayUnion(currentUser.uid) }); const latestSnap = await getDoc(chatRef); const currentFinishedBy = latestSnap.data().finishedBy || [];
                    if(currentFinishedBy.length >= 2) { 
                        await updateDoc(chatRef, { status: 'completed' }); await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid), { successfulTrades: increment(1) });
                        const otherUid = chatData.participants.find(id => id !== currentUser.uid); await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', otherUid), { successfulTrades: increment(1) });
                        await processItemConsumption(chatData.offerId); showMessage("Éxito!");
                    } else { showMessage("Esperando a la otra parte"); }
                } else if(type === 'cancelled') { await updateDoc(chatRef, { status: 'cancelled' }); showMessage("Cancelado"); }
            } catch (e) {}
        };
    </script>
</body>
</html>
